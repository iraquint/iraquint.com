<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Ira Quint</title>
  <!-- Two redaction bars — the site's own idea at favicon scale. Deliberately
       heavy: thinner bars hold up at 32px but wash out at 16px, which is where
       a favicon actually lives. No background tile, so it reads on light and
       dark browser chrome alike (a dark tile simply disappears on dark). -->
  <rect x="2" y="9"  width="28" height="6" rx="1.5" fill="#eab308"/>
  <rect x="2" y="18" width="18" height="6" rx="1.5" fill="#eab308"/>
</svg>
