<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Ira Quint · Training</title>
  <!-- IQ on the page's navy, slanted forward like it's already moving.
       Letters are drawn as shapes (no font) and kept heavy so they still read
       at 16px. The tile carries it on dark browser chrome, where navy alone
       would sink. -->
  <rect width="32" height="32" rx="7" fill="#1E3A8A"/>
  <g transform="skewX(-12) translate(4 0)">
    <rect x="5" y="7.5" width="4.5" height="17" fill="#fff"/>
    <rect x="14" y="9.75" width="9.5" height="12.5" rx="3.5" fill="none" stroke="#fff" stroke-width="4.5"/>
    <path d="M20 21.5 L26 27" stroke="#fff" stroke-width="4" stroke-linecap="square"/>
  </g>
</svg>
